<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gadget Hub</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1c1c1a; --dim: #6b6b66;
    --line: #e2e1dc; --accent: #c15f3c; --mine: #efe9e2; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1b19; --panel: #242422; --text: #ecebe6; --dim: #9a9993;
      --line: #383834; --accent: #e07a52; --mine: #33302b; --error: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  #gadgets { font-size: 13px; color: var(--dim); }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: min(680px, 92%); padding: 10px 14px; border-radius: 14px;
         white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel);
         border: 1px solid var(--line); }
  .msg.user { align-self: flex-end; background: var(--mine); border-color: transparent; }
  .msg .from { display: block; font-size: 12px; color: var(--dim); margin-bottom: 2px; }
  .status { align-self: flex-start; font-size: 13px; color: var(--dim); padding: 0 4px; }
  .error { color: var(--error); }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line);
         background: var(--panel); }
  textarea { flex: 1; resize: none; font: inherit; color: inherit; background: var(--bg);
             border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-height: 42px; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 0 16px; min-height: 42px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #login { margin: auto; max-width: 420px; padding: 24px 16px; display: none; }
  #login input { width: 100%; font: inherit; padding: 10px 12px; margin: 8px 0 12px;
                 border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: inherit; }
  code { font-size: 14px; }
</style>
</head>
<body>
<header><h1>Gadget Hub</h1><span id="gadgets"></span></header>
<section id="login">
  <p>Paste the hub's admin token. On the hub, it's in
     <code>/var/lib/gadgethub/admin_token</code>.</p>
  <input id="token" type="password" autocomplete="off" aria-label="Admin token">
  <button id="save">Open chat</button>
</section>
<main id="log" aria-live="polite"></main>
<form id="form">
  <textarea id="input" rows="1" placeholder="Message Claude" aria-label="Message"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
let token = '';
try { token = localStorage.getItem('gadgethub-token') || ''; } catch (e) {}
let statusLine = null;

function auth() { return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }; }

function add(cls, text, from) {
  const div = document.createElement('div');
  div.className = cls;
  if (from) { const f = document.createElement('span'); f.className = 'from'; f.textContent = from; div.append(f); }
  div.append(document.createTextNode(text));
  $('log').append(div);
  $('log').scrollTop = $('log').scrollHeight;
  return div;
}

function setStatus(text) {
  if (!text) { if (statusLine) statusLine.remove(); statusLine = null; return; }
  if (!statusLine) statusLine = add('status', '');
  statusLine.textContent = text;
  $('log').append(statusLine);
}

function onEvent(event) {
  const p = event.payload || {};
  if (event.event === 'message.user') {
    const gadget = (p.origin || '').startsWith('gadget:') ? 'From ' + p.origin.slice(7) : '';
    add('msg user', p.text || '', gadget);
  } else if (event.event === 'delta.message_done') {
    setStatus('');
    add('msg', p.display_text || '');
  } else if (event.event === 'agent.status') {
    setStatus(p.activity_code === 'idle' ? '' : (p.activity_text || 'Working') + '…');
  }
}

async function readLines(response, onLine) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) return;
    buffer += decoder.decode(value, { stream: true });
    let i;
    while ((i = buffer.indexOf('\n')) >= 0) {
      const line = buffer.slice(0, i); buffer = buffer.slice(i + 1);
      if (line.trim()) onLine(JSON.parse(line));
    }
  }
}

async function follow() {
  for (;;) {
    try {
      const response = await fetch('/api/events?session_id=main', { headers: auth() });
      if (response.status === 401) { showLogin(); return; }
      await readLines(response, onEvent);
    } catch (e) {}
    await new Promise((r) => setTimeout(r, 3000));
  }
}

async function refreshGadgets() {
  try {
    const response = await fetch('/api/devices', { headers: auth() });
    if (!response.ok) return;
    const devices = (await response.json()).devices;
    const online = devices.filter((d) => d.connected).map((d) => d.name);
    $('gadgets').textContent = online.length ? online.join(', ') : 'No gadgets connected';
  } catch (e) {}
}

function showLogin() {
  $('login').style.display = 'block';
  $('log').style.display = $('form').style.display = 'none';
}

$('save').onclick = () => {
  token = $('token').value.trim();
  try { localStorage.setItem('gadgethub-token', token); } catch (e) {}
  location.reload();
};

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const message = $('input').value.trim();
  if (!message) return;
  $('input').value = '';
  $('send').disabled = true;
  try {
    const response = await fetch('/api/chat', { method: 'POST', headers: auth(), body: JSON.stringify({ message }) });
    if (!response.ok) add('status error', 'The hub refused the message (HTTP ' + response.status + ').');
    else await readLines(response, () => {});
  } catch (err) {
    add('status error', 'Could not reach the hub.');
  } finally {
    $('send').disabled = false;
    refreshGadgets();
  }
};

$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('form').requestSubmit(); }
});

if (!token) showLogin();
else { follow(); refreshGadgets(); setInterval(refreshGadgets, 30000); }
</script>
</body>
</html>
